[project]
name = "housecall-pro-mcp"
version = "1.0.0"
description = "Connect Housecall Pro to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Housecall Pro API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["housecall pro", "housecall pro api", "housecall pro mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/housecall-pro-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=housecall-pro"
Source = "https://github.com/cotlet-connect/housecall-pro-mcp"

[project.scripts]
housecall-pro-mcp = "housecall_pro_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"housecall_pro_agent.py" = "housecall_pro_agent.py"

[tool.hatch.build.targets.sdist]
include = ["housecall_pro_agent.py", "README.md", "LICENSE", "mcp.json", "skills", "examples", ".cursor"]
